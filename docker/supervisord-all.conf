[supervisord]
nodaemon=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /home/app/conf/nginx/nginx-all.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=/usr/local/bin/notify-exchange-server -c /home/app/config.toml --db-url=%(ENV_NOTIFY_EXCHANGE_DB_URL)s --msg-db-url=%(ENV_NOTIFY_EXCHANGE_MSG_DB_URL)s --cache-db-url=%(ENV_NOTIFY_EXCHANGE_CACHE_DB_URL)s
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
