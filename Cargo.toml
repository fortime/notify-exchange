[package]
name = "notify-exchange"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "notify-exchange-server"
path = "src/bin/server.rs"

[[bin]]
name = "notify-exchange-util"
path = "src/bin/util.rs"

[[bin]]
name = "notify-exchange-http-proxy"
path = "src/bin/http_proxy/main.rs"

[dependencies]
aes-gcm = "0.10.3"
async-trait = "0.1.89"
axum = "0.8.1"
axum-extra = { version = "0.10.3", features = ["cookie", "typed-header"] }
axum_typed_multipart = { version = "0.16.4", default-features = false }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", default-features = false, features = ["serde"] }
clap = { version = "4.5.37", features = ["derive"] }
console-subscriber = { version = "0.4.1", optional = true }
dotenv = { version = "0.15.0", optional = true }
either = "1.15.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
futures = "0.3.31"
getset = "0.1.5"
hex = "0.4.3"
hmac = "0.12.1"
num_enum = "0.7.4"
paste = "1.0.15"
rand = "0.8"
regex = { version = "1.12.2", default-features = false }
reqwest = "0.12.23"
rsa = { version = "0.9.8", features = ["sha2"] }
sea-orm = "1.1.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
serde_with = "3.14.0"
sha2 = "0.11.0"
snafu = "0.8.5"
teloxide = { version = "0.17.0", features = ["webhooks-axum"] }
tempfile = "3.20.0"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "tracing", "macros", "time", "signal"] }
tokio-util = "0.7.16"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.17.0", default-features = false, features = ["v7", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }

[features]
default = ["sqlite", "rustls"]
sqlite = ["sea-orm/sqlx-sqlite"]
mysql = ["sea-orm/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres"]
rustls = ["sea-orm/runtime-tokio-rustls"]
native-tls = ["sea-orm/runtime-tokio-native-tls"]
debug = ["console-subscriber", "axum/macros"]
