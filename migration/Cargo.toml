[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros"] }

[dependencies.sea-orm-migration]
version = "1.1.0"
features = [
  "sqlx-sqlite", "sqlx-mysql", "sqlx-postgres"
]

[features]
default = ["rustls"]
rustls = ["sea-orm-migration/runtime-tokio-rustls"]
native-tls = ["sea-orm-migration/runtime-tokio-native-tls"]
